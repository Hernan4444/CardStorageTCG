<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardStorage</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <h1>🃏 CardStorage</h1>
  <div class="header-actions">
    <span id="admin-status" class="admin-status">Modo lectura</span>
    <button id="admin-toggle-btn" class="btn btn-secondary">Desbloquear admin</button>
    <button id="open-upload-btn" class="btn btn-primary">+ Subir carta</button>
  </div>
</header>

<!-- ── Gallery ────────────────────────────────────────────────────────────── -->
<main>
  <div id="card-grid"></div>
  <p id="empty-state" hidden>
    No hay cartas aún. ¡Sube la primera con el botón de arriba!
  </p>
</main>

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Upload Modal                                                             -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<div id="upload-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="upload-title">
  <div class="modal">

    <div class="modal-header">
      <h2 id="upload-title">Subir carta</h2>
      <button id="close-upload-btn" class="btn btn-icon" aria-label="Cerrar">✕</button>
    </div>

    <!-- Step 1: choose source -->
    <div id="step-source">
      <div class="source-buttons">
        <button id="use-camera-btn" class="btn btn-primary">📷 Tomar foto</button>
        <button id="use-file-btn"   class="btn btn-secondary">📂 Subir archivo</button>
      </div>
      <input
        id="file-input"
        type="file"
        accept="image/*"
        style="display:none"
      />
    </div>

    <!-- Step 2: camera live view -->
    <div id="step-camera" hidden>
      <video id="camera-feed" autoplay playsinline></video>
      <div class="camera-controls">
        <button id="capture-btn" class="btn btn-primary">📸 Capturar</button>
      </div>
    </div>

    <!-- Step 3: card detection preview -->
    <div id="step-preview" hidden>
      <img id="preview-img" src="" alt="Vista previa de la carta" />
      <div class="preview-actions">
        <button id="retake-btn"          class="btn btn-secondary">↩ Retomar</button>
        <button id="confirm-preview-btn" class="btn btn-primary">Continuar →</button>
      </div>
    </div>

    <!-- Step 4: metadata form -->
    <div id="step-metadata" hidden>
      <form id="metadata-form" novalidate>
        <div class="form-group">
          <label for="game_name">Juego</label>
          <select id="game_name" name="game_name" required></select>
        </div>

        <div class="form-group">
          <label for="anime">Anime</label>
          <select id="anime" name="anime" required></select>
        </div>

        <div class="form-group" id="other-anime-group" hidden>
          <label for="other_anime_name">Otro anime</label>
          <input
            id="other_anime_name"
            name="other_anime_name"
            type="text"
            placeholder="Escribe el nombre del anime"
            maxlength="120"
          />
        </div>

        <div class="form-group" id="other-game-group" hidden>
          <label for="other_game_name">Otro juego</label>
          <input
            id="other_game_name"
            name="other_game_name"
            type="text"
            placeholder="Escribe el nombre del juego"
            maxlength="100"
          />
        </div>

        <div class="form-group">
          <label for="language">Idioma</label>
          <select id="language" name="language" required>
            <option value="Español">Español</option>
            <option value="Ingles">Ingles</option>
            <option value="Japones" selected>Japones</option>
            <option value="Chino">Chino</option>
          </select>
        </div>

        <div class="form-group">
          <label for="card_type">Tipo de carta</label>
          <select id="card_type" name="card_type" required>
            <option value="normal">Normal</option>
            <option value="foil">Foil ✨</option>
          </select>
        </div>

        <div id="upload-error" role="alert"></div>

        <div class="form-actions">
          <button type="button" id="back-to-preview-btn" class="btn btn-secondary">← Atrás</button>
          <button type="submit" class="btn btn-primary">Guardar carta</button>
        </div>
      </form>
    </div>

  </div><!-- /.modal -->
</div><!-- /#upload-modal -->

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Detail Modal                                                             -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<div id="detail-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="modal">

    <div class="modal-header">
      <h2 id="detail-title">Detalle de carta</h2>
      <button id="close-detail-btn" class="btn btn-icon" aria-label="Cerrar">✕</button>
    </div>

    <img id="detail-img" src="" alt="Imagen de la carta en detalle" />

    <div id="detail-info"></div>

    <div class="detail-actions">
      <button id="detail-hd-btn" class="btn btn-primary">Ver en HD</button>
    </div>

  </div><!-- /.modal -->
</div><!-- /#detail-modal -->

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Edit Modal                                                               -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<div id="edit-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <div class="modal">

    <div class="modal-header">
      <h2 id="edit-title">Editar carta</h2>
      <button id="close-edit-btn" class="btn btn-icon" aria-label="Cerrar">✕</button>
    </div>

    <form id="edit-form" novalidate>
      <div class="form-group">
        <label for="edit_game_name">Juego</label>
        <select id="edit_game_name" name="game_name" required></select>
      </div>

      <div class="form-group">
        <label for="edit_anime">Anime</label>
        <select id="edit_anime" name="anime" required></select>
      </div>

      <div class="form-group" id="edit-other-anime-group" hidden>
        <label for="edit_other_anime_name">Otro anime</label>
        <input
          id="edit_other_anime_name"
          name="other_anime_name"
          type="text"
          placeholder="Escribe el nombre del anime"
          maxlength="120"
        />
      </div>

      <div class="form-group" id="edit-other-game-group" hidden>
        <label for="edit_other_game_name">Otro juego</label>
        <input
          id="edit_other_game_name"
          name="other_game_name"
          type="text"
          placeholder="Escribe el nombre del juego"
          maxlength="100"
        />
      </div>

      <div class="form-group">
        <label for="edit_language">Idioma</label>
        <select id="edit_language" name="language" required>
          <option value="Español">Español</option>
          <option value="Ingles">Ingles</option>
          <option value="Japones">Japones</option>
          <option value="Chino">Chino</option>
        </select>
      </div>

      <div class="form-group">
        <label for="edit_card_type">Tipo de carta</label>
        <select id="edit_card_type" name="card_type" required>
          <option value="normal">Normal</option>
          <option value="foil">Foil ✨</option>
        </select>
      </div>

      <div id="edit-error" role="alert"></div>

      <div class="form-actions">
        <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>

  </div><!-- /.modal -->
</div><!-- /#edit-modal -->

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Admin Modal                                                              -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<div id="admin-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="admin-title">
  <div class="modal">

    <div class="modal-header">
      <h2 id="admin-title">Desbloquear modo admin</h2>
      <button id="close-admin-btn" class="btn btn-icon" aria-label="Cerrar">✕</button>
    </div>

    <form id="admin-form" novalidate>
      <div class="form-group">
        <label for="admin_password">Contraseña admin</label>
        <input
          id="admin_password"
          name="admin_password"
          type="password"
          placeholder="Ingresa contraseña"
          autocomplete="current-password"
          required
        />
      </div>

      <div id="admin-error" role="alert"></div>

      <div class="form-actions">
        <button type="button" id="cancel-admin-btn" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
    </form>

  </div><!-- /.modal -->
</div><!-- /#admin-modal -->

<!-- ── Scripts ────────────────────────────────────────────────────────────── -->
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
